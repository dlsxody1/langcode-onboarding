# 실습 3 검색 품질 회귀 테스트.
# DB 없이 돈다. 문서를 다시 파싱·색인해서 커밋된 index.json 이 최신인지 확인하고 (색인은 결정적이라 diff 로 비교 가능),
# 그 색인으로 평가한다. R@3 가 기준 아래로 떨어지거나 권한 누출이 1건이라도 있으면 실패한다.
name: lab3 eval

on:
  push:
    paths: ["labs/lab3-rag/**", "lib/rag/**", "lib/slug.ts", "0*/**", "data/**", ".github/workflows/lab3-eval.yml"]
  pull_request:
    paths: ["labs/lab3-rag/**", "lib/rag/**", "lib/slug.ts", "0*/**", "data/**", ".github/workflows/lab3-eval.yml"]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # .mts / .ts 를 빌드 없이 바로 실행 (type stripping)
          cache: npm
      - run: npm ci
      # 평가셋을 다시 만들어 커밋된 것과 같은지 본다 (정답 문서·절 오타 검증 포함)
      - run: npm run lab:eval-set && git diff --exit-code labs/lab3-rag/data/eval.jsonl
      # 문서를 고치고 색인을 다시 만들지 않은 채 커밋하면 여기서 걸린다. 리랭커가 읽을 chunks.json 도 만든다
      - run: npm run lab:index && git diff --exit-code labs/lab3-rag/generated/index.json
      - run: npm run lab:eval -- --ci --min-recall3 0.88
      - run: npm run lab:eval -- --compare
